name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run linter
        run: uv run ruff check src/ scripts/ tests/

      - name: Run tests
        run: uv run pytest tests/ -v --ignore=tests/infrastructure/sidra
        # Note: SIDRA integration tests require network access and are excluded from CI.
        # Run locally with: uv run pytest tests/infrastructure/sidra/ -v
