[project]
name = "silicon-sampling-brazil"
version = "1.0.0"
description = "Replication code for 'Simulating Brazilian Public Opinion with Large Language Models' (IEEE ACDSA 2027)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "pydantic>=2.13.4",
    "pyreadstat>=1.2.8",
    "pyyaml>=6.0.1",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[tool.uv]
package = true

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
